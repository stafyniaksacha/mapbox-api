name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Dart ${{ matrix.sdk }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest SDK where the dev dependencies (lints 5, test 1.25+) resolve.
          # Keep it in sync with the dev dependencies (plan, Phase 2).
          # On this SDK only the runtime dependency (http) is downgraded to its
          # lower bound: a full `pub downgrade` also downgrades the test
          # framework's own dependencies to versions that do not compile on
          # Dart 3. pana below checks full-downgrade analysis on stable.
          - sdk: '3.5.0'
            deps: lower bound
          - sdk: stable
            deps: upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub upgrade
      - name: Use lowest allowed runtime dependency versions
        if: matrix.deps == 'lower bound'
        run: dart pub downgrade http
      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  consumer-floor:
    # Checks the declared SDK floor from a consumer's point of view. A path
    # dependency does not resolve the package's dev dependencies, so this
    # can run on an SDK older than the one the test job needs.
    name: consumer (Dart ${{ matrix.sdk }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.4.0']
        deps: [upgrade, downgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: mapbox_api
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}
      - name: Create consumer package
        run: |
          mkdir -p consumer/bin
          cat > consumer/pubspec.yaml <<'EOF'
          name: consumer
          publish_to: none
          environment:
            sdk: ^3.4.0
          dependencies:
            mapbox_api:
              path: ../mapbox_api
          EOF
          cat > consumer/bin/consumer.dart <<'EOF'
          import 'package:mapbox_api/mapbox_api.dart';

          void main() {
            final api = MapboxApi(accessToken: 'pk.test');
            // Touch every API object so the whole public surface compiles.
            print([
              api.directions,
              api.mapMatching,
              api.isochrone,
              api.matrix,
              api.optimization,
              api.forwardGeocoding,
              api.reverseGeocoding,
              api.intersection,
            ].length);
          }
          EOF
      - name: Resolve (${{ matrix.deps }})
        working-directory: consumer
        run: dart pub ${{ matrix.deps }}
      - working-directory: consumer
        run: dart analyze --fatal-infos
      - working-directory: consumer
        run: dart run bin/consumer.dart

  api-compat:
    name: public API vs 1.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub global activate dart_apitool
      # Fails on any breaking change to the public API since the published
      # 1.1.0 release. Additive changes are allowed.
      - run: >-
          dart-apitool diff
          --old pub://mapbox_api/1.1.0
          --new .
          --version-check-mode=onlyBreakingChanges

  pana:
    # Reports the pub.dev score; does not fail on missing points.
    name: pub.dev score (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning .
